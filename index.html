<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming Plus PRO</title>

<style>
body { margin:0; font-family:'Segoe UI',sans-serif; background:#000; color:white; }
header { background:black; padding:15px; display:flex; flex-direction:column; gap:10px; align-items:center; border-bottom:2px solid red; }
header h1 { color:red; font-size:20px; margin:0; }
.search { padding:10px; border-radius:10px; border:none; width:90%; max-width:400px; }
.container { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:15px; padding:15px; }
.card { background:#111; border-radius:15px; overflow:hidden; transition:0.3s; box-shadow:0 0 10px rgba(255,0,0,0.3); }
.card:hover { transform:scale(1.05); box-shadow:0 0 20px red; }
.card img { width:100%; height:100px; object-fit:contain; background:#fff; padding:10px; }
.badge { position:absolute; background:red; padding:3px 8px; font-size:10px; border-radius:8px; margin:5px; }
.card-content { padding:10px; }
.card-content h2 { font-size:14px; margin:5px 0; }
.price { color:red; font-size:14px; }
.btn { background:red; border:none; padding:8px; width:100%; border-radius:10px; cursor:pointer; color:white; font-size:12px; }
.btn:hover { background:#cc0000; }
.testimonials { padding:20px 10px; text-align:center; }
.testimonial { background:#111; margin:10px auto; padding:10px; border-radius:10px; max-width:300px; font-size:12px; }
.whatsapp { position:fixed; bottom:15px; right:15px; background:#25D366; padding:12px; border-radius:50%; text-decoration:none; font-size:18px; }
footer { text-align:center; padding:15px; font-size:12px; border-top:2px solid red; }
@media(min-width:768px){
header{flex-direction:row; justify-content:space-between; padding:15px 30px;}
header h1{font-size:24px;}
.container{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));}
.card img{height:150px;}
.card-content h2{font-size:18px;}
.price{font-size:18px;}
.btn{font-size:14px;}
}
</style>
</head>

<body>

<header>
<h1>Streaming Plus PRO</h1>
<input type="text" class="search" placeholder="Buscar servicio..." onkeyup="buscar()">
</header>

<div class="container" id="cards"></div>

<script>
const servicios = [
{nombre:'Netflix', precio:20, img:'https://cdn.worldvectorlogo.com/logos/netflix-4.svg'},
{nombre:'Disney+', precio:15, img:'https://cdn.worldvectorlogo.com/logos/disney.svg'},
{nombre:'Spotify', precio:10, img:'https://cdn.worldvectorlogo.com/logos/spotify-2.svg'},
{nombre:'HBO Max', precio:17, img:'https://cdn.worldvectorlogo.com/logos/hbo-max-1.svg'},
{nombre:'Prime Video', precio:18, img:'https://cdn.worldvectorlogo.com/logos/amazon-prime-video-1.svg'},
{nombre:'YouTube Premium', precio:12, img:'https://cdn.worldvectorlogo.com/logos/youtube-icon.svg'},
{nombre:'Apple Music', precio:14, img:'https://cdn.worldvectorlogo.com/logos/apple-music-1.svg'}
];

function render(lista){
const cont = document.getElementById('cards');
cont.innerHTML='';
lista.forEach(s=>{
cont.innerHTML += `
<div class="card">
<div class="badge">Top</div>
<img src="${s.img}" alt="${s.nombre}">
<div class="card-content">
<h2>${s.nombre}</h2>
<div class="price">Bs. ${s.precio}/mes</div>
<button class="btn" onclick="comprar('${s.nombre}')">Comprar</button>
</div>
</div>`;
});
}

function buscar(){
const texto=document.querySelector('.search').value.toLowerCase();
const filtrados=servicios.filter(s=>s.nombre.toLowerCase().includes(texto));
render(filtrados);
}

function comprar(servicio){
window.open(`https://wa.me/59168193304?text=Quiero comprar ${servicio}`);
}

render(servicios);
</script>

<div class="testimonials">
<h2>Opiniones</h2>
<div class="testimonial">⭐ Excelente servicio</div>
<div class="testimonial">🔥 Muy recomendado</div>
<div class="testimonial">💯 Funciona perfecto</div>
</div>

<a class="whatsapp" href="https://wa.me/59168193304" target="_blank">💬</a>

<footer>
© 2026 Streaming Plus PRO | 68193304
</footer>

</body>
</html>
